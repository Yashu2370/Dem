<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Excel Data Checker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: #e2e8f0;
  padding: 20px;
}
h1 {
  color: #38bdf8;
}
input, select, button {
  margin: 10px 0;
  padding: 8px;
  border-radius: 6px;
  border: none;
}
button {
  background: #38bdf8;
  color: black;
  cursor: pointer;
}
.result {
  margin-top: 20px;
  padding: 15px;
  background: #1e293b;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>📊 Excel Data Checker</h1>

<input type="file" id="fileInput" accept=".xlsx,.xls" />
<br>

<label>Select Column:</label>
<select id="columnSelect"></select>
<br>

<button onclick="analyzeData()">Analyze</button>

<div class="result" id="output"></div>

<script>
let jsonData = [];

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(evt) {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: 'array' });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    jsonData = XLSX.utils.sheet_to_json(sheet);

    populateColumns();
  };

  reader.readAsArrayBuffer(file);
});

function populateColumns() {
  const select = document.getElementById('columnSelect');
  select.innerHTML = "";

  if (jsonData.length > 0) {
    Object.keys(jsonData[0]).forEach(col => {
      let option = document.createElement("option");
      option.value = col;
      option.text = col;
      select.appendChild(option);
    });
  }
}

function analyzeData() {
  const col = document.getElementById('columnSelect').value;
  let values = jsonData.map(row => row[col]).filter(v => v !== undefined);

  let output = "";

  // Convert numbers
  let numbers = values.map(v => Number(v)).filter(v => !isNaN(v));
  numbers.sort((a,b) => a - b);

  // Missing numbers
  let missing = [];
  for (let i = 0; i < numbers.length - 1; i++) {
    let diff = numbers[i+1] - numbers[i];
    if (diff > 1) {
      for (let j = 1; j < diff; j++) {
        missing.push(numbers[i] + j);
      }
    }
  }

  // Duplicates
  let duplicates = values.filter((item, index) => values.indexOf(item) !== index);

  // Format check
  let hasText = values.some(v => typeof v === "string" && isNaN(v));
  let hasNumber = values.some(v => !isNaN(Number(v)));

  output += "<h3>Results:</h3>";

  output += "<b>Missing Numbers:</b> " + (missing.length ? missing.join(", ") : "None") + "<br><br>";
  output += "<b>Duplicates:</b> " + (duplicates.length ? [...new Set(duplicates)].join(", ") : "None") + "<br><br>";

  if (hasText && hasNumber) {
    output += "<b>Format Issue:</b> Mixed (Text + Numbers)<br>";
  } else {
    output += "<b>Format:</b> Consistent<br>";
  }

  document.getElementById('output').innerHTML = output;
}
</script>

</body>
</html>
