<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Excel Row Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; background:#0f172a; color:white; padding:20px; }
table { border-collapse: collapse; width:100%; }
td, th { border:1px solid #334155; padding:8px; }

.exact { background:#ef4444; color:white; }
.similar { background:#f59e0b; }
.diff { background:#38bdf8; color:black; }

.legend span {
  display:inline-block;
  padding:6px 10px;
  margin:4px;
  border-radius:5px;
}
</style>
</head>

<body>

<h2>📊 Smart Excel Row Analyzer</h2>

<!-- 🔥 LEGEND -->
<div class="legend" style="margin:15px 0; padding:10px; background:#1e293b; border-radius:8px;">
  <strong>Legend:</strong><br>
  <span style="background:#ef4444;">Red Row = Exact duplicate</span>
  <span style="background:#f59e0b;">Orange Row = Small typo</span>
  <span style="background:#38bdf8;">Blue Cell = Changed column</span>
  <span style="background:#334155;">OK = No issue</span>
</div>

<input type="file" id="fileInput">

<div id="output"></div>

<script>
// FILE LOAD
document.getElementById('fileInput').addEventListener('change', function(e){
  const reader = new FileReader();

  reader.onload = function(evt){
    const wb = XLSX.read(new Uint8Array(evt.target.result), {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, {header:1});

    analyze(data);
  };

  reader.readAsArrayBuffer(e.target.files[0]);
});

// SIMILARITY FUNCTION (Levenshtein)
function similarity(a, b) {
  function editDistance(s1, s2) {
    let dp = Array(s2.length + 1).fill(null).map(() =>
      Array(s1.length + 1).fill(null)
    );

    for (let i = 0; i <= s1.length; i++) dp[0][i] = i;
    for (let j = 0; j <= s2.length; j++) dp[j][0] = j;

    for (let j = 1; j <= s2.length; j++) {
      for (let i = 1; i <= s1.length; i++) {
        if (s1[i - 1] === s2[j - 1]) {
          dp[j][i] = dp[j - 1][i - 1];
        } else {
          dp[j][i] = Math.min(
            dp[j - 1][i - 1] + 1,
            dp[j][i - 1] + 1,
            dp[j - 1][i] + 1
          );
        }
      }
    }
    return dp[s2.length][s1.length];
  }

  if (!a && !b) return 1;

  let longer = a.length > b.length ? a : b;
  let shorter = a.length > b.length ? b : a;

  let dist = editDistance(longer, shorter);
  return (longer.length - dist) / longer.length;
}

// MAIN ANALYZER
function analyze(data){
  let headers = data[0];
  let rows = data.slice(1);

  let html = "<table><tr>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "<th>Issues</th></tr>";

  rows.forEach((row, i) => {

    let rowClass = "";
    let issues = [];
    let diffCols = new Set();

    let prevRow = rows[i - 1];

    if (prevRow) {
      let matchCount = 0;

      for (let k = 0; k < row.length; k++) {
        let val1 = (row[k] || "").toString().toLowerCase().trim();
        let val2 = (prevRow[k] || "").toString().toLowerCase().trim();

        let sim = similarity(val1, val2);

        if (sim === 1) {
          matchCount++;
        } 
        else if (sim > 0.95) {
          diffCols.add(k); // only very close differences
        }
      }

      let matchPercent = (matchCount / row.length) * 100;

      if (matchPercent === 100) {
        rowClass = "exact";
        issues.push("Exact Duplicate Row");
      } 
      else if (matchPercent > 90) {
        rowClass = "similar";
        issues.push("Minor typo (1-2 letter difference)");
      }
    }

    html += `<tr class="${rowClass}">`;

    row.forEach((cell, index) => {
      let cellClass = diffCols.has(index) ? "diff" : "";
      html += `<td class="${cellClass}">${cell ?? ""}</td>`;
    });

    html += `<td>${issues.join("<br>") || "OK"}</td>`;
    html += "</tr>`;
  });

  html += "</table>";

  document.getElementById("output").innerHTML = html;
}
</script>

</body>
</html>
