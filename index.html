<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Library Analyzer - Full Consistency</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; padding:20px; }
.container { max-width:1100px; margin:auto; background:white; padding:20px; border-radius:10px; }

.error { color:red; }
.ok { color:green; }

.box { margin:10px 0; padding:10px; border-left:5px solid red; background:#ffe6e6; }
.good { border-left:5px solid green; background:#e6ffe6; }
</style>
</head>

<body>

<div class="container">
<h2>📊 Full Consistency Analyzer</h2>

<input type="file" id="fileInput">
<br><br>
<button onclick="analyze()">Analyze</button>

<div id="output"></div>
</div>

<script>

function analyze() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return alert("Upload file");

    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        process(json);
    };

    reader.readAsArrayBuffer(file);
}

function process(data) {

    let output = "";

    if (data.length === 0) return;

    // 👉 Take FIRST ROW as STANDARD
    let base = data[0];

    data.forEach((row, i) => {

        let r = i + 2;
        let errors = [];

        let fields = ["Access_No","Title","Call_No","Date_Year","Location","Keywords","LinkPath","Subject","Department"];

        fields.forEach(f => {

            let baseVal = (base[f] || "").toString().toLowerCase();
            let currVal = (row[f] || "").toString().toLowerCase();

            // STRICT MATCH (pattern similarity check)
            if (!isSimilar(baseVal, currVal)) {
                errors.push(`${f} not consistent`);
            }

            // EXTRA CHECK: missing dot
            if (f === "LinkPath") {
                if (/pdf$/.test(currVal) && !currVal.endsWith(".pdf")) {
                    errors.push("Missing '.' before pdf");
                }
            }

        });

        if (errors.length > 0) {
            output += `<div class="box">
            <b>Row ${r} ❌</b><br>
            ${errors.map(e => "• "+e).join("<br>")}
            </div>`;
        } else {
            output += `<div class="box good">
            <b>Row ${r} ✅ Perfect</b>
            </div>`;
        }

    });

    document.getElementById("output").innerHTML = output;
}


// 🔥 SMART SIMILARITY FUNCTION
function isSimilar(base, current) {

    // remove numbers to compare pattern
    let b = base.replace(/\d+/g, "");
    let c = current.replace(/\d+/g, "");

    return b === c;
}

</script>

</body>
</html>
