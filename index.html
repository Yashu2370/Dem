<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Row Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; background:#0f172a; color:white; padding:20px; }
table { border-collapse: collapse; width:100%; }
td, th { border:1px solid #334155; padding:8px; }
.issue { background:#ef4444; }
.warn { background:#f59e0b; }
.format { background:#eab308; color:black; }
</style>
</head>

<body>

<h2>📊 Line-by-Line Excel Analyzer</h2>
<input type="file" id="fileInput">

<div id="output"></div>

<script>
document.getElementById('fileInput').addEventListener('change', function(e){
  const reader = new FileReader();

  reader.onload = function(evt){
    const wb = XLSX.read(new Uint8Array(evt.target.result), {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, {header:1});

    analyzeRows(data);
  };

  reader.readAsArrayBuffer(e.target.files[0]);
});

function analyzeRows(data){
  let headers = data[0];
  let rows = data.slice(1);

  let html = "<table><tr>";

  headers.forEach(h => html += `<th>${h}</th>`);
  html += "<th>Issues</th></tr>";

  let seenValues = {};

  rows.forEach((row, rowIndex) => {
    let issues = [];
    html += "<tr>";

    row.forEach((cell, colIndex) => {
      let cls = "";

      // Missing value
      if(cell === undefined || cell === ""){
        cls = "issue";
        issues.push(`Missing value in ${headers[colIndex]}`);
      }

      // Format check
      if(typeof cell === "string" && !isNaN(cell)){
        cls = "format";
        issues.push(`Format issue in ${headers[colIndex]}`);
      }

      // Duplicate across rows
      let key = headers[colIndex] + "_" + cell;
      if(seenValues[key]){
        cls = "warn";
        issues.push(`Duplicate in ${headers[colIndex]}`);
      } else {
        seenValues[key] = true;
      }

      html += `<td class="${cls}">${cell ?? ""}</td>`;
    });

    // Row-to-row comparison (simple pattern)
    if(rowIndex > 0){
      let prevRow = rows[rowIndex - 1];
      if(JSON.stringify(row) === JSON.stringify(prevRow)){
        issues.push("Exact duplicate row");
      }
    }

    html += `<td>${issues.join("<br>") || "OK"}</td>`;
    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("output").innerHTML = html;
}
</script>

</body>
</html>
