<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Library Data Analyzer Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; padding:20px; }
.container { max-width:1000px; margin:auto; background:white; padding:20px; border-radius:10px; }
.good { color:green; }
.bad { color:red; }
.warn { color:orange; }
.box { background:#f1f1f1; padding:10px; margin:10px 0; border-left:4px solid #3498db; }
</style>
</head>

<body>

<div class="container">
<h2>📊 Library Data Analyzer</h2>

<input type="file" id="fileInput" accept=".xlsx,.xls">
<br><br>
<button onclick="analyzeExcel()">Analyze File</button>

<div id="output"></div>
</div>

<script>

function analyzeExcel() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) {
        alert("Upload Excel file");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        processData(json);
    };

    reader.readAsArrayBuffer(file);
}

function processData(data) {

    let callMap = {};
    let duplicates = [];
    let typos = [];
    let missing = [];
    let errors = [];
    let accessNumbers = [];

    data.forEach((row, index) => {

        let r = index + 2;

        let access = (row.Access_No || "").toString();
        let title = (row.Title || "").toString();
        let call = (row.Call_No || "").toString();
        let date = (row.Date_Year || "").toString();
        let location = (row.Location || "").toString();
        let keywords = (row.Keywords || "").toString();
        let link = (row.LinkPath || "").toString();
        let subject = (row.Subject || "").toString();
        let dept = (row.Department || "").toString();

        let num = access.replace("DL","");

        // Collect numbers
        if (!isNaN(num)) accessNumbers.push(parseInt(num));

        // Duplicate Call_No
        if (call && callMap[call]) {
            duplicates.push(`Row ${r}: ${access} → ${call}`);
        } else {
            callMap[call] = true;
        }

        // Call_No mismatch
        if (call && num && !call.includes(num)) {
            typos.push(`Row ${r}: ${access} → ${call}`);
        }

        // Title vs Keywords
        if (title && keywords) {
            let firstWord = title.split(" ")[0].toLowerCase();
            if (!keywords.toLowerCase().includes(firstWord)) {
                errors.push(`Row ${r}: Keywords not matching Title`);
            }
        }

        // Subject vs Department
        if (subject && dept) {
            let sub = subject.split(" ")[0].toLowerCase();
            if (!dept.toLowerCase().includes(sub)) {
                errors.push(`Row ${r}: Subject & Department mismatch`);
            }
        }

        // LinkPath mismatch
        if (link && access && !link.toLowerCase().includes(access.toLowerCase())) {
            errors.push(`Row ${r}: LinkPath mismatch`);
        }

        // ✅ Check missing ".pdf"
        if (link && !link.toLowerCase().endsWith(".pdf")) {
            errors.push(`Row ${r}: Missing ".pdf" → ${link}`);
        }

        // ✅ Check missing dot before pdf
        if (/dl\d+pdf$/i.test(link)) {
            errors.push(`Row ${r}: Missing "." before pdf → ${link}`);
        }

        // Date format
        if (date && !/^\d{4}\/\d{2}$/.test(date)) {
            errors.push(`Row ${r}: Invalid Date format`);
        }

        // Location
        if (location && location !== "Library") {
            errors.push(`Row ${r}: Location inconsistent`);
        }

    });

    // Missing Access Numbers
    accessNumbers.sort((a,b)=>a-b);
    for (let i=0;i<accessNumbers.length-1;i++){
        let diff = accessNumbers[i+1] - accessNumbers[i];
        if (diff > 1){
            for (let j=1;j<diff;j++){
                missing.push("DL"+(accessNumbers[i]+j));
            }
        }
    }

    // OUTPUT
    let html = `<h3 class="good">✅ ✔ What is Consistent</h3>
    <p>Structure is mostly uniform.</p>`;

    html += `<h3 class="bad">⚠️ Issues Found</h3>`;

    if (!duplicates.length && !typos.length && !missing.length && !errors.length) {
        html += `<p class="good">No issues found</p>`;
    }

    duplicates.forEach(d => html += `<p class="bad">${d}</p>`);
    typos.forEach(t => html += `<p class="bad">${t}</p>`);
    missing.forEach(m => html += `<p class="warn">Missing: ${m}</p>`);
    errors.forEach(e => html += `<p class="warn">${e}</p>`);

    html += `<h3 class="good">🟢 Done</h3>`;

    document.getElementById("output").innerHTML = html;
}

</script>

</body>
</html>
