<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Library Data Analyzer</title>

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    padding: 20px;
}
textarea {
    width: 100%;
    height: 150px;
    margin-bottom: 10px;
}
button {
    padding: 10px;
    margin: 5px 0;
}
.result {
    background: white;
    padding: 15px;
    border-radius: 8px;
}
.good { color: green; }
.bad { color: red; }
.warn { color: orange; }
</style>
</head>

<body>

<h2>📊 Library Data Analyzer</h2>

<textarea id="inputData" placeholder="Paste your data here..."></textarea>
<br>
<button onclick="analyze()">Analyze Data</button>

<div class="result" id="output"></div>

<script>
function analyze() {

    let text = document.getElementById("inputData").value.trim();
    let rows = text.split("\n").slice(1); // skip header

    let callNos = {};
    let duplicateErrors = [];
    let typoErrors = [];

    rows.forEach((row, index) => {
        let cols = row.split("\t");

        let access = cols[2];
        let callNo = cols[4];

        // Duplicate check
        if (callNos[callNo]) {
            duplicateErrors.push(`Duplicate Call_No: ${callNo} (Row ${index+2})`);
        } else {
            callNos[callNo] = true;
        }

        // Typo check (length mismatch)
        let expected = access.replace("DL", "");
        if (!callNo.includes(expected)) {
            typoErrors.push(`Possible typo in ${access} → ${callNo}`);
        }
    });

    let output = "";

    output += `<h3 class="good">✅ Consistency Check</h3>`;
    output += `<p>Structure appears consistent across all rows.</p>`;

    output += `<h3 class="bad">❌ Errors Found</h3>`;

    if (duplicateErrors.length === 0 && typoErrors.length === 0) {
        output += `<p class="good">No major errors found</p>`;
    } else {
        duplicateErrors.forEach(e => {
            output += `<p class="bad">${e}</p>`;
        });

        typoErrors.forEach(e => {
            output += `<p class="bad">${e}</p>`;
        });
    }

    output += `<h3 class="warn">⚠️ Notes</h3>`;
    output += `<p>Check subject vs department naming consistency manually.</p>`;

    document.getElementById("output").innerHTML = output;
}
</script>

</body>
</html>
