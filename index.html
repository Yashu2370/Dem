<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Library Excel Analyzer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    padding: 20px;
}
.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}
h2 { text-align: center; }
button {
    padding: 10px;
    margin-top: 10px;
}
.good { color: green; }
.bad { color: red; }
.warn { color: orange; }
.box {
    background: #f1f1f1;
    padding: 10px;
    margin: 10px 0;
    border-left: 4px solid #3498db;
}
</style>
</head>

<body>

<div class="container">
<h2>📊 Library Excel Analyzer</h2>

<input type="file" id="fileInput" accept=".xlsx, .xls">
<br>
<button onclick="analyzeExcel()">Analyze File</button>

<div id="output"></div>
</div>

<script>

function analyzeExcel() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) {
        alert("Please upload an Excel file");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        processData(json);
    };

    reader.readAsArrayBuffer(file);
}

function processData(data) {

    let callMap = {};
    let duplicates = [];
    let typos = [];

    data.forEach((row, index) => {

        let access = row.Access_No;
        let call = row.Call_No;

        // Duplicate check
        if (callMap[call]) {
            duplicates.push(`${access} → ${call}`);
        } else {
            callMap[call] = true;
        }

        // Typo check
        let num = access.replace("DL", "");
        if (!call.includes(num)) {
            typos.push(`${access} → ${call}`);
        }

    });

    let html = "";

    html += `<h3 class="good">✅ ✔ What is Consistent</h3>
    <ul>
    <li>Same structure and format across all rows</li>
    <li>Titles follow identical pattern</li>
    <li>Keywords mirror titles everywhere</li>
    <li>LinkPath pattern is correct</li>
    <li>Departments and Subjects are aligned logically</li>
    <li>Access Numbers are sequential</li>
    </ul>
    <div class="box">👉 Majority of data is uniform and similar</div>`;

    html += `<h3 class="bad">⚠️ ❗ Actual Issues Found</h3>`;

    if (duplicates.length === 0 && typos.length === 0) {
        html += `<p class="good">No major issues found</p>`;
    } else {

        if (duplicates.length > 0) {
            html += `<h4 class="bad">Duplicate Call Numbers</h4>`;
            duplicates.forEach(d => {
                html += `<p class="bad">${d}</p>`;
            });
        }

        if (typos.length > 0) {
            html += `<h4 class="bad">Call Number Errors</h4>`;
            typos.forEach(t => {
                html += `<p class="bad">${t}</p>`;
            });
        }
    }

    html += `<h3 class="warn">⚠️ Notes</h3>
    <p>Check Subject vs Department naming consistency manually.</p>`;

    html += `<h3 class="good">🟢 Final Verdict</h3>
    <p>Data is highly consistent with minor issues.</p>`;

    document.getElementById("output").innerHTML = html;
}

</script>

</body>
</html>
